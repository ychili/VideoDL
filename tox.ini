[tox]
env_list =
    py{311,312,313,314,315}
    pypy311

[testenv]
description = run the tests with pytest
package = wheel
wheel_build_env = .pkg
deps =
    pytest>=7.3
commands =
    pytest --import-mode=importlib --doctest-modules {tty:--color=yes} {posargs}

[testenv:mypy]
description = type check with mypy
deps =
    mypy
    {[testenv]deps}
    types-yt-dlp>=2026.3.17.20260503
    types-PyYAML
    types-setuptools
commands =
    mypy {posargs}

[testenv:pylint]
description = lint with Pylint
deps =
    pylint>=2.15
    {[testenv]deps}
    setuptools
commands =
    pylint {posargs:scripts setup.py tests video_dl.py}

[testenv:ruff]
description = lint with Ruff
skip_install = true
deps =
    ruff
commands =
    ruff check {posargs}
